<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><link rel="stylesheet" href="css/base.css"><title>EEG Calls : Update and Statistics | NEURON Hospital</title><style>
.eeg-calls-loading{min-height:45vh;display:grid;place-items:center;text-align:center;font-size:18px;font-weight:900;color:var(--p)}
.eeg-calls-error{background:#fff3f2;border:1px solid #f3c2bd;color:#b42318;border-radius:14px;padding:14px;font-weight:800;text-align:center}.month-card{margin-bottom:14px}.month-heading{margin:0 0 8px;font-size:18px}.month-summary{font-weight:900}.month-empty{color:var(--muted);font-weight:700;padding:8px 0}.patient-list{display:grid;gap:8px}.eeg-call-patient{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}.eeg-call-patient strong{display:block}.eeg-call-patient small{display:block;color:var(--muted);margin-top:3px}.secure-note{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}.eeg-edit-separator{border:0;border-top:1px solid var(--line);margin:28px 0 22px}.selected-patient{font-size:18px;font-weight:900;margin-bottom:18px}.update-busy{background:#6b7280 !important;color:#fff !important;opacity:1}.update-wait{text-align:center;font-weight:800;color:var(--p);margin-top:8px}.update-error{background:#fff3f2;border:1px solid #f3c2bd;color:#b42318;border-radius:12px;padding:12px;margin-top:10px;font-weight:700}.history-actions{display:flex;justify-content:space-between;gap:12px;margin:8px 0 0}.history-actions button{flex:1}.changed-list{margin:8px 0 0;padding-left:22px;text-align:left}.success{text-align:left}.success h2{margin-top:0}
</style></head><body data-title="EEG Calls : Update and Statistics"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>EEG Calls : Update and Statistics</h1><p>One day secure update in EEG details</p></section>
<section id="gate" class="card secure-wrap"><h2>🔐 Secure Access</h2><input id="password" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]*" autocomplete="off"><button id="enter" class="cta" style="width:100%;margin-top:10px" type="button">Access Portal</button><div class="secure-note">6-digit numeric password</div></section>
<section id="loading" class="card eeg-calls-loading" hidden>Loading EEG Calls Details</section>
<section id="error" class="card eeg-calls-error" hidden></section>
<section id="portal" hidden>
  <section id="monthlyStats"></section>
  <div class="history-actions"><button id="loadPreviousCalls" class="btn btn-secondary" type="button">Load Previous Calls</button><button id="downloadDetails" class="btn btn-secondary" type="button">Download Details</button></div>
  <div id="historyError" class="update-error" hidden></div>
  <hr class="eeg-edit-separator">
  <section id="edit" class="card" hidden>
    <div class="selected-patient">Selected Patient : <span id="selectedPatientName"></span></div>
    <div class="grid">
      <div class="field full"><label>Patient Name</label><input id="editName"></div>
      <div class="field"><label>Age</label><div class="input-row"><input id="editAge" type="number" min="0.01" step="0.1" inputmode="decimal"><select id="editAgeUnit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div>
      <div class="field full"><label>Address</label><input id="editAddress"></div>
      <div class="field full"><label>WhatsApp Number</label><div class="prefix-wrap"><span class="prefix">+91</span><input id="editWhatsapp" maxlength="10" inputmode="numeric"></div></div>
      <div class="field full"><label>Referred By Dr / Hospital</label><input id="editReferredBy"></div>
      <div class="field"><label>EEG Technician</label><input id="editTechnician"></div>
      <div class="field"><label>Payment Received</label><input id="editPayment" type="number" min="0" step="1" inputmode="decimal"></div>
      <div class="field full"><button id="updateDetails" class="cta" style="width:100%" type="button">Update Details</button><div id="updateWait" class="update-wait" hidden>Wait EEG details are Updating</div><div id="updateError" class="update-error" hidden></div></div>
    </div>
  </section>
  <section id="confirmation" hidden></section>
</section>
</div></main><div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/common.js"></script><script src="js/eeg_calls_update_stats.js"></script>
</body></html>
