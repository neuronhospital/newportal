<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><link rel="stylesheet" href="css/base.css"><title>OPD Booking | NEURON Hospital</title><style>
.required-field::before{content:"*";color:#d32f2f;font-weight:700;margin-right:4px}
.date-field-wrap{position:relative}.date-field-wrap input{padding-right:42px}.date-field-wrap input::-webkit-calendar-picker-indicator{display:none}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:6px}.calendar-head strong{flex:1;text-align:center;white-space:nowrap;overflow:hidden}.calendar-nav{width:32px;height:32px;padding:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px}.calendar-nav:disabled{opacity:.35}.date-calendar-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:20px;cursor:pointer;z-index:2;line-height:1}.selected-patient-card{margin-top:18px;padding:14px 16px;border:1px solid #d8c7df;border-radius:12px;background:#faf7fc;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.selected-patient-card-title{font-weight:700;font-size:15px;margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid #e5dce8}
.selected-patient-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.selected-patient-card-grid>div{min-width:0}
.selected-patient-card-grid span{display:block;font-size:12px;color:#667085;margin-bottom:2px}
.selected-patient-card-grid strong{display:block;font-size:14px;overflow-wrap:anywhere}
@media(max-width:600px){.selected-patient-card-grid{grid-template-columns:1fr}}
.followup-city-section{margin:12px 0 18px}.followup-city-heading{font-weight:700;font-size:15px;padding:9px 11px;margin-bottom:7px;border-radius:8px;background:#f3eef8;color:#5a1a78;border-left:4px solid #7b1fa2}.followup-city-section .patient-option{margin-bottom:6px}</style></head>
<body data-title="OPD Booking"><div id="header"></div><main><div class="container">
<section id="gate" class="card secure-wrap"><h2>🔐 Secure Access</h2><input id="password" type="password" inputmode="numeric" maxlength="6" placeholder="Password"><button id="enter" class="cta" style="width:100%;margin-top:10px">Access Portal</button></section>
<section id="portal" hidden>
<section class="page-title"><h1>OPD Booking Portal</h1><p>Book a new or follow-up appointment</p></section>

<section class="card">
  <div class="choice-row">
    <button id="follow" class="choice active" type="button">Follow-up</button>
    <button id="new" class="choice" type="button">New</button>
  </div>

  <!-- Follow-up retrieval is shown ONLY in Follow-up mode. -->
  <div id="followFields" style="margin-top:14px">
    <label class="required-field">WhatsApp Number</label>
    <div class="input-row">
      <div class="prefix-wrap"><span class="prefix">+91</span><input id="followWa" maxlength="10" inputmode="numeric" autocomplete="tel"></div>
      <button id="load" class="btn btn-secondary" type="button">Load</button>
    </div>
    <div id="followStatus" class="status" aria-live="polite"></div>
    <div id="patients" class="patient-list"></div>

    <div id="selectedPatientCard" class="selected-patient-card" hidden aria-live="polite">
      <div class="selected-patient-card-title">Selected Patient</div>
      <div class="selected-patient-card-grid">
        <div><span>Name</span><strong id="selectedPatientName">—</strong></div>
        <div><span>Age</span><strong id="selectedPatientAge">—</strong></div>
        <div><span>City</span><strong id="selectedPatientCity">—</strong></div>
        <div><span>Previous Booking</span><strong id="selectedPatientBookingDate">—</strong></div>
      </div>
    </div>
  </div>

  <div id="bookingFields" hidden>
  <div id="newFields" hidden>
    <div class="grid" style="margin-top:14px">
      <div class="field"><label class="required-field">Patient's Name</label><input id="name" autocomplete="name"></div>
      <div class="field"><label class="required-field">Age</label><div class="input-row"><input id="age" type="number" step=".1" min="0.01"><select id="unit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div>
      <div class="field full"><label class="required-field">Patient Address</label><input id="address" autocomplete="street-address"></div>
      <div class="field full"><label>Referred By Dr./Hospital</label><input id="ref"></div>

      <div id="newWhatsAppField" class="field full">
        <label class="required-field">Enter WhatsApp Number</label>
        <div class="input-row">
          <div class="prefix-wrap"><span class="prefix">+91</span><input id="wa" maxlength="10" inputmode="numeric" autocomplete="tel" oncopy="return false" oncut="return false"></div>
        </div>
        <label class="required-field" style="margin-top:10px">Verify WhatsApp Number</label>
        <div class="input-row">
          <div class="prefix-wrap"><span class="prefix">+91</span><input id="verifyWa" maxlength="10" inputmode="numeric" autocomplete="off" oncopy="return false" oncut="return false"></div><span id="verifyTick" style="display:none;color:#168a4a;font-size:22px;font-weight:700;margin-left:8px">✓</span>
        </div>
        <div id="waStatus" class="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div class="grid" style="margin-top:14px">
    <div class="field"><label class="required-field">Payment Mode</label><select id="payMode"><option>Cash</option><option>Online</option><option>Split</option></select></div>

    <!-- Cash/Online: visible. Split: replaced by Cash + Online only. -->
    <div id="singleChargeField" class="field"><label id="opdChargesLabel" class="required-field">OPD Charges Paid in Cash</label><input id="amount" type="number" min="0" max="2000" value="500" inputmode="decimal"></div>
    <div id="splitField" class="field full" hidden>
      <div class="payment-grid">
        <div><label class="required-field">Cash</label><input id="cash" type="number" min="0" max="2000" value="" inputmode="decimal"></div>
        <div><label class="required-field">Online</label><input id="online" type="number" min="0" max="2000" value="" inputmode="decimal"></div>
      </div>
      <div id="splitTotal" class="payment-total">Total: ₹0</div>
    </div>

    <div class="field"><label class="required-field">Visit Location</label><select id="city"></select></div>
    <div class="field"><label class="required-field">Date of Appointment</label><div class="date-field-wrap"><input id="date" readonly disabled placeholder="Tap to select date"><span id="dateIcon" class="date-calendar-icon" title="Select date">📅</span></div><div id="dateLoading" class="status" aria-live="polite" hidden></div><div id="cal" class="calendar" hidden></div></div>
    <div class="field"><label class="required-field">Next Follow-up City</label><select id="next" disabled></select></div>

    <div class="field full">
      <button id="book" class="cta" disabled style="width:100%" type="button">Book OPD Appointment</button>
      <div id="submitStatus" class="status" aria-live="polite"></div>
    </div>
  </div>
  </div>
</section>

<section id="confirmation" hidden></section>
</div></main><div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/idb.js"></script><script src="js/common.js"></script><script src="js/secure.js"></script><script src="js/schedule.js"></script><script src="js/opd_booking.js"></script><script src="js/recovery.js"></script>
</body></html>
