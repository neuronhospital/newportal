<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><link rel="stylesheet" href="css/base.css"><title>Statistics | NEURON Hospital</title><script src="js/secure-preload.js"></script></head><body data-title="Statistics"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>Patient / EEG Retrieval Portal</h1><p>Statistics and collection reports</p></section>
<section id="gate" class="card secure-wrap"><h2>🔐 Secure Access</h2><input id="password" type="password" inputmode="numeric" maxlength="6"><button id="enter" class="cta" style="width:100%;margin-top:10px">Access Portal</button></section>
<section id="portal" hidden><section class="card"><div class="grid"><div><label>City</label><select id="city"></select></div><div><label>Date</label><select id="period"></select></div><div><button id="get" class="cta" style="width:100%">Retrieve Records</button><button id="cancelRetrieval" type="button" class="btn btn-secondary" hidden style="width:100%;margin-top:8px">Cancel Retrieval</button><div id="retrievalStatus" class="status" aria-live="polite"></div></div></div></section><section id="historyGate" class="card secure-wrap" hidden><h2>🔐 Historical Statistics Access</h2><p class="status">Previous statistics require additional access.</p><input id="historyPassword" type="password" inputmode="numeric" maxlength="8" placeholder="Historical access password"><button id="historyUnlock" class="cta" style="width:100%;margin-top:10px">Unlock Historical Statistics</button><div id="historyStatus" class="status"></div></section><section id="results" class="card"></section></section>
</div></main><div id="footer"></div><script src="js/config.js"></script><script src="js/schedule.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/common.js"></script><script src="js/secure.js"></script><script src="js/stats.js"></script></body></html>
