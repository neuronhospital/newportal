<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7b1fa2">
<title>NEURON HTTP Diagnostic</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f5f7;color:#222}
main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 8px}
p{margin:6px 0 14px;line-height:1.45}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;background:#7b1fa2;color:#fff}
button:disabled{opacity:.6;cursor:wait}
#status{margin-top:14px;font-weight:600}
#summary{margin-top:16px;padding:12px;border-radius:10px;background:#f0eef2;white-space:pre-wrap}
#log{margin-top:16px;background:#111;color:#eee;padding:14px;border-radius:10px;overflow:auto;white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:220px}
.warn{font-weight:600}
</style>
</head>
<body>
<main>
<section class="card">
<h1>NEURON Minimal HTTP Response Diagnostic</h1>
<p>This test calls the same Apps Script web-app URL but uses a minimal backend action with no booking, Spreadsheet, ScriptProperties, Script Lock, OPD_TODAY, or FCM work.</p>
<p class="warn">Diagnostic only. Do not use this page for patient booking.</p>
<button id="run" type="button">Run Minimal HTTP Test</button>
<div id="status">Ready.</div>
<div id="summary"></div>
<pre id="log"></pre>
</section>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/diagnostic_http.js"></script>
</body>
</html>
