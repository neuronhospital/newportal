<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><meta name="description" content="EEG outside calls in Latur"><link rel="stylesheet" href="css/base.css"><title>EEG Calls | NEURON Hospital</title><style>
.required-field::before{content:"*";color:#d32f2f;font-weight:700;margin-right:4px}.eeg-call-note{color:var(--muted);font-size:13px;margin:5px 0 0}.booking-error{background:#fff3f2;border:1px solid #f3c2bd;color:#b42318;border-radius:12px;padding:12px;margin-top:10px;font-weight:700}.booking-loading{color:var(--p);font-weight:800}
</style></head><body data-title="EEG Calls"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>EEG Calls Portal</h1><p>EEG outside calls in Latur</p></section>
<section class="card">
<div class="grid">
<div class="field full"><label class="required-field">Patient Name</label><input id="patientName" autocomplete="name"></div>
<div class="field"><label class="required-field">Age</label><div class="input-row"><input id="age" type="number" min="0.01" step="0.1" inputmode="decimal"><select id="ageUnit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div>
<div class="field full"><label class="required-field">Address</label><input id="address" autocomplete="street-address"></div>
<div class="field full"><label class="required-field">Enter WhatsApp Number</label><div class="prefix-wrap"><span class="prefix">+91</span><input id="whatsapp" maxlength="10" inputmode="numeric" autocomplete="tel" oncopy="return false" oncut="return false"></div></div>
<div class="field full"><label class="required-field">Verify WhatsApp Number</label><div class="input-row"><div class="prefix-wrap"><span class="prefix">+91</span><input id="verifyWhatsapp" maxlength="10" inputmode="numeric" autocomplete="off" oncopy="return false" oncut="return false"></div><span id="verifyTick" style="display:none;color:#168a4a;font-size:22px;font-weight:700;margin-left:8px">✓</span></div><div id="waStatus" class="status" aria-live="polite"></div></div>
<div class="field full"><label class="required-field">Referred By Dr / Hospital</label><input id="referredBy"></div>
<div class="field"><label class="required-field">EEG Technician</label><input id="eegTechnician" value="Sanket Katke"></div>
<div class="field"><label class="required-field">Payment Received</label><input id="paymentReceived" type="number" min="0" step="1" value="1000" inputmode="decimal"></div>
<div class="field full"><button id="book" class="cta" style="width:100%" type="button">Book EEG Appointment</button><div id="submitStatus" class="status" aria-live="polite"></div></div>
</div></section>
<section id="confirmation" hidden></section>
</div></main><div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/common.js"></script><script src="js/eeg_calls_booking.js"></script>
</body></html>
