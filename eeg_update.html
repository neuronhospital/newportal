<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><meta name="color-scheme" content="light"><link rel="stylesheet" href="css/base.css"><title>Update EEG Details | NEURON Hospital</title><style>
#loadMessage,#updateMessage{margin-top:8px}.loading-state{background:#7b1fa2!important;color:#fff!important}.readonly-field{background:#f5f5f5}.payment-total{margin-top:8px;font-weight:700}.split-payment{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.split-payment{grid-template-columns:1fr}}
</style></head><body data-title="Update EEG Details"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>Update EEG Details</h1><p>Secure same-day update</p></section>
<section id="gate" class="card secure-wrap"><h2>🔐 Secure Access</h2><input id="password" type="password" inputmode="numeric" maxlength="6" placeholder="Password"><button id="enter" class="cta" style="width:100%;margin-top:10px">Access Portal</button></section>
<section id="portal" hidden><section class="card"><div class="grid"><div><label>City</label><select id="city"></select></div><div><label>WhatsApp Number</label><div class="input-row"><div class="prefix-wrap"><span class="prefix">+91</span><input id="wa" type="tel" inputmode="numeric" maxlength="10" pattern="[6789][0-9]{9}"></div><button id="load" class="btn btn-secondary">Load</button></div><div id="loadMessage" class="status" hidden>Wait we are Loading Patient details from system...</div></div></div><div id="status" class="status"></div><div id="patients" class="patient-list"></div></section>
<section id="edit" class="card" hidden><div class="grid"><div><label>Patient Name</label><input id="name" class="readonly-field" readonly></div><div><label>Age</label><div class="input-row"><input id="age" class="readonly-field" type="number" step=".1" readonly><select id="unit" disabled><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div>
<div class="field full" id="singlePayment"><label id="singlePaymentLabel">EEG Charges Paid in Cash</label><input id="amount" type="number" min="0" max="3000"></div>
<div class="field full" id="splitPayment" hidden><label>EEG Charges Paid in Split</label><div class="split-payment"><div><label>Paid in Cash</label><input id="cash" type="number" min="0" max="3000"></div><div><label>Paid Online</label><input id="online" type="number" min="0" max="3000"></div></div><div id="total" class="payment-total">Total Amount Paid: ₹0</div></div>
<div class="field full"><button id="save" class="cta" style="width:100%">Update EEG Details</button><div id="updateMessage" class="status" hidden>Wait we are updating EEG details to system...</div></div></div></section><section id="confirmation" hidden></section></section></div></main><div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/idb.js"></script><script src="js/common.js"></script><script src="js/secure.js"></script><script src="js/schedule.js"></script><script>document.body.dataset.mode="eeg";</script>
<script>
document.addEventListener("DOMContentLoaded",()=>{const $=U.$;let selected=null;let originalPayment={cash:0,online:0};
$('city').innerHTML=NEURON_CONFIG.cities.map(x=>`<option>${U.esc(x)}</option>`).join('');
const scheduledCity=window.Schedule?.cityAtNow?.(NEURON_CONFIG.cities)||'Latur';
if(NEURON_CONFIG.cities.includes(scheduledCity))$('city').value=scheduledCity;
$('city').addEventListener('change',()=>{clearState();});
function clearState(){selected=null;$('patients').innerHTML='';$('edit').hidden=true;$('confirmation').hidden=true;$('confirmation').innerHTML='';$('status').textContent='';$('amount').value='';$('cash').value='';$('online').value='';$('total').textContent='Total Amount Paid: ₹0';$('updateMessage').hidden=true}
function setLoading(on){$('load').disabled=on;$('load').textContent=on?'Loading...':'Load';$('load').className=on?'btn btn-primary loading-state':'btn btn-secondary';$('loadMessage').hidden=!on}
function inferMode(cash,online){if(cash>0&&online>0)return 'Split';if(online>0)return 'Online';return 'Cash'}
function showPayment(x){const cash=Number(x.eegCashPaid)||0,online=Number(x.eegOnlinePaid)||0;originalPayment={cash,online};const mode=inferMode(cash,online);if(mode==='Split'){$('singlePayment').hidden=true;$('splitPayment').hidden=false;$('cash').value=cash;$('online').value=online;updateTotal()}else{$('singlePayment').hidden=false;$('splitPayment').hidden=true;$('singlePaymentLabel').textContent=mode==='Online'?'EEG Charges Paid Online':'EEG Charges Paid in Cash';$('amount').value=mode==='Online'?online:cash}}
function updateTotal(){$('total').textContent='Total Amount Paid: ₹'+((Number($('cash').value)||0)+(Number($('online').value)||0))}
function selectPatient(x,b){selected=x;document.querySelectorAll('.patient-option').forEach(z=>z.classList.remove('selected'));if(b)b.classList.add('selected');$('confirmation').hidden=true;$('confirmation').innerHTML='';$('status').textContent='';$('edit').hidden=false;$('name').value=x.name||'';$('age').value=x.age??'';$('unit').value=x.ageUnit||'years';showPayment(x);setTimeout(()=>{$('name').scrollIntoView({behavior:'smooth',block:'center'});$('name').focus();},100)}
document.getElementById('wa').addEventListener('input',()=>{const msg=document.getElementById('waError');if(msg&&/^[6789]\d{9}$/.test(document.getElementById('wa').value.trim()))msg.textContent='';});$('load').onclick=async()=>{if($('load').disabled)return;const wa=$('wa').value.trim();if(!/^[6789]\d{9}$/.test(wa)){let msg=document.getElementById('waError');if(!msg){msg=document.createElement('div');msg.id='waError';msg.style.color='red';$('wa').closest('.input-row').parentElement.appendChild(msg)}msg.textContent='Enter 10 digit number given at the time of OPD Booking';return}let oldMsg=document.getElementById('waError');if(oldMsg)oldMsg.textContent='';clearState();setLoading(true);try{const r=await NeuronAPI.call('getEEGBookedPatientsByWhatsApp',{whatsapp:U.phone($('wa').value),city:$('city').value});r.patients.forEach(x=>{const b=document.createElement('button');b.className='patient-option';b.innerHTML=`<b>${U.esc(x.name)}</b><small>${x.age} ${U.esc(x.ageUnit||'years')} • ${U.date(x.date)}</small>`;b.onclick=()=>selectPatient(x,b);$('patients').appendChild(b)});if(r.patients.length===1){const b=$('patients').querySelector('.patient-option');selectPatient(r.patients[0],b)}}catch(e){$('status').textContent=e.message||'Unable to load patient details.'}finally{setLoading(false)}};
$('cash').oninput=updateTotal;$('online').oninput=updateTotal;
$('save').onclick=async()=>{if(!selected||$('save').disabled)return;let cash,online;if($('splitPayment').hidden){const amount=Number($('amount').value)||0;const mode=$('singlePaymentLabel').textContent.includes('Online')?'Online':'Cash';cash=mode==='Cash'?amount:0;online=mode==='Online'?amount:0}else{cash=Number($('cash').value)||0;online=Number($('online').value)||0}const total=cash+online;if(!Number.isFinite(total)||total<0||total>3000)return alert('EEG charges must be between ₹0 and ₹3000.');const mode=inferMode(cash,online),id=U.uuid('upd'),p={updateRequestId:id,appointmentId:selected.appointmentId,city:selected.city||$('city').value,whatsapp:selected.whatsapp||U.phone($('wa').value),whatsappNew:selected.whatsapp||U.phone($('wa').value),name:selected.name,age:Number(selected.age),ageUnit:selected.ageUnit,address:selected.address||'',referredBy:selected.referredBy||'',eegCharges:total,eegPaymentMode:mode,eegCashPaid:cash,eegOnlinePaid:online};$('save').disabled=true;$('save').textContent='Updating...';$('save').className='btn btn-primary loading-state';$('updateMessage').hidden=false;try{await IDB.put('tx',{id,type:'EEG_UPDATE',status:'pending',payload:p});const r=await NeuronAPI.call('updateEEGDetails',p,25000);await IDB.put('tx',{id,type:'EEG_UPDATE',status:'complete',payload:p,result:r});const before=r.before||{},after=r.after||{};const changes=[];const add=(label,a,b)=>{if(String(a??'')!==String(b??''))changes.push(`<div class="confirm-row"><span>${U.esc(label)}</span><b>${U.esc(String(a??''))} → ${U.esc(String(b??''))}</b></div>`)};add('EEG Charges',before.eegCharges,after.eegCharges);add('Paid in Cash',before.eegCashPaid,after.eegCashPaid);add('Paid Online',before.eegOnlinePaid,after.eegOnlinePaid);$('confirmation').hidden=false;$('confirmation').innerHTML=`<div class="success"><div class="success-icon">✓</div><h2>EEG Details Updated</h2><p>Appointment ID: <b>${U.esc(r.appointmentId||selected.appointmentId)}</b></p>${changes.length?'<p><b>Changed values</b></p>'+changes.join(''):'<p>No values were changed.</p>'}</div>`;selected.eegCharges=after.eegCharges;selected.eegCashPaid=after.eegCashPaid;selected.eegOnlinePaid=after.eegOnlinePaid;originalPayment={cash:after.eegCashPaid||0,online:after.eegOnlinePaid||0}}catch(e){try{await IDB.put('tx',{id,type:'EEG_UPDATE',status:'uncertain',payload:p})}catch(_){}alert(e.message||'Update status is uncertain. Do not repeat it until the original request is checked.')}finally{$('save').disabled=false;$('save').textContent='Update EEG Details';$('save').className='cta';$('updateMessage').hidden=true}};
});
</script></body></html>
