<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><meta name="color-scheme" content="light"><link rel="stylesheet" href="css/base.css"><title>Update EEG Details | NEURON Hospital</title><style>
#loadMessage,#updateMessage{margin-top:8px}.loading-state{background:#7b1fa2!important;color:#fff!important}.readonly-field{background:#f5f5f5}.payment-total{margin-top:8px;font-weight:700}.split-payment{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.split-payment{grid-template-columns:1fr}}
</style></head><body data-title="Update EEG Details"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>Update EEG Details</h1><p>Secure same-day update</p></section>
<section id="gate" class="card secure-wrap"><h2>🔐 Secure Access</h2><input id="password" type="password" inputmode="numeric" maxlength="6" placeholder="Password"><button id="enter" class="cta" style="width:100%;margin-top:10px">Access Portal</button></section>
<section id="portal" hidden><section class="card"><div class="grid"><div><label>City</label><select id="city"></select></div><div><label>WhatsApp Number</label><div class="input-row"><div class="prefix-wrap"><span class="prefix">+91</span><input id="wa" type="tel" inputmode="numeric" maxlength="10" pattern="[6789][0-9]{9}"></div><button id="load" class="btn btn-secondary">Load</button></div><div id="loadMessage" class="status" hidden>Wait we are Loading Patient details from system...</div></div></div><div id="status" class="status"></div><div id="patients" class="patient-list"></div></section>
<section id="edit" class="card" hidden><div class="grid"><div><label>Patient Name</label><input id="name" class="readonly-field" readonly></div><div><label>Age</label><div class="input-row"><input id="age" class="readonly-field" type="number" step=".1" readonly><select id="unit" disabled><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div>
<div class="field full" id="singlePayment"><label id="singlePaymentLabel">EEG Charges Paid in Cash</label><input id="amount" type="number" min="0" max="3000"></div>
<div class="field full" id="splitPayment" hidden><label>EEG Charges Paid in Split</label><div class="split-payment"><div><label>Paid in Cash</label><input id="cash" type="number" min="0" max="3000"></div><div><label>Paid Online</label><input id="online" type="number" min="0" max="3000"></div></div><div id="total" class="payment-total">Total Amount Paid: ₹0</div></div>
<div class="field full"><button id="save" class="cta" style="width:100%">Update EEG Details</button><div id="updateMessage" class="status" hidden>Wait we are updating EEG details to system...</div></div></div></section><section id="confirmation" hidden></section></section></div></main><div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/common.js"></script><script src="js/secure.js"></script><script src="js/schedule.js"></script>
<script src="js/eeg_update.js"></script></body></html>
