<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><link rel="stylesheet" href="css/base.css"><title>Update OPD Details | NEURON Hospital</title></head><body data-title="Update OPD Details"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>Update OPD Details</h1><p>Secure same-day update</p></section>
<section id="gate" class="card secure-wrap"><h2>🔐 Secure Access</h2><input id="password" type="password" inputmode="numeric" maxlength="6" placeholder="Password"><button id="enter" class="cta" style="width:100%;margin-top:10px">Access Portal</button></section>
<section id="portal" hidden><section class="card"><div class="grid"><div><label>City</label><select id="city"></select></div><div><label>WhatsApp Number</label><div class="input-row"><div class="prefix-wrap"><span class="prefix">+91</span><input id="wa" maxlength="10"></div><button id="load" class="btn btn-secondary">Load</button></div><div id="loadMessage" class="status" hidden>Wait we are Loading Today's OPD details from system...</div></div></div><div id="status" class="status"></div><div id="patients" class="patient-list"></div></section>
<section id="edit" class="card" hidden><div class="grid"><div><label>Patient Name</label><input id="name"></div><div><label>Age</label><div class="input-row"><input id="age" type="number" step=".1"><select id="unit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div><div class="field full"><label>Address</label><textarea id="address"></textarea></div><div><label>Referred By Dr./Hospital</label><input id="ref"></div><div><label>Correct WhatsApp Number</label><input id="editWa" maxlength="10"></div><div id="opdSingle"><label id="chargeLabel">OPD Charges Paid in Cash</label><input id="charge" type="number" min="0" max="2000"></div><div id="opdSplit" class="field full" hidden><div class="payment-grid"><div><label id="cashLabel">Paid in Cash</label><input id="cash" type="number" min="0" max="2000"></div><div><label id="onlineLabel">Paid Online</label><input id="online" type="number" min="0" max="2000"></div></div><div class="payment-total">Total Amount Paid: <span id="opdTotalPaid">₹0</span></div></div><div class="field full"><button id="save" class="cta" style="width:100%">Update OPD Details</button><div id="updateMessage" class="status" hidden>Wait we are updating OPD details to system...</div></div></div></section><section id="confirmation" hidden></section></section></div></main><div id="footer"></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/idb.js"></script><script src="js/common.js"></script><script src="js/secure.js"></script><script>document.body.dataset.mode="opd";</script><script src="js/opd_update.js"></script><script src="js/recovery.js"></script></body></html>
