<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><link rel="stylesheet" href="css/base.css"><title>Update OPD Details | NEURON Hospital</title><style>
.opd-loading{color:#7b1fa2;font-weight:800;margin-top:8px}.opd-loading-btn{background:#7b1fa2!important;color:#fff!important}.opd-updating-btn{background:#7b1fa2!important;color:#fff!important}.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.payment-total{margin-top:9px;background:#f7f7fb;border-radius:10px;padding:10px;font-weight:900}.changed-list{margin:10px 0 0;padding-left:20px}.changed-list li{margin:5px 0}
</style><script src="js/secure-preload.js"></script></head><body data-title="Update OPD Details"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>Update OPD Details</h1><p>Secure same-day update</p></section>
<section id="gate" class="card secure-wrap"><h2>🔐 Secure Access</h2><input id="password" type="password" inputmode="numeric" maxlength="6" placeholder="Password"><button id="enter" class="cta" style="width:100%;margin-top:10px">Access Portal</button></section>
<section id="portal" hidden><section class="card"><div class="grid"><div><label class="required-field">City</label><select id="city"></select></div><div><label class="required-field">WhatsApp Number</label><div class="input-row"><div class="prefix-wrap"><span class="prefix">+91</span><input id="wa" maxlength="10" inputmode="numeric"></div><button id="load" class="btn btn-secondary">Load</button></div><div id="loadStatus" class="status" hidden></div></div></div><div id="status" class="status"></div><div id="patients" class="patient-list"></div></section>
<section id="edit" class="card" hidden><div class="grid"><div><label class="required-field">Patient Name</label><input id="name"></div><div><label class="required-field">Age</label><div class="input-row"><input id="age" type="number" step=".1"><select id="unit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div><div class="field full"><label class="required-field">Address</label><textarea id="address"></textarea></div><div><label>Referred By Dr./Hospital</label><input id="ref"></div><div><label class="required-field">Correct WhatsApp Number</label><input id="editWa" maxlength="10" inputmode="numeric"></div><div><label class="required-field">Next Follow-up City</label><select id="nextFollowupCity"></select></div><div id="chargeField"><label id="chargeLabel" class="required-field">OPD Charges Paid</label><input id="charge" type="number" min="0" max="2000"></div><div id="splitCashField" hidden><label class="required-field">Paid in Cash</label><input id="cash" type="number" min="0" max="2000"></div><div id="splitOnlineField" hidden><label class="required-field">Paid Online</label><input id="online" type="number" min="0" max="2000"></div><div id="splitTotalField" class="field full" hidden><div class="payment-total">Total Amount Paid: ₹<span id="totalPaid">0</span></div></div><div class="field full"><button id="save" class="cta" style="width:100%">Update OPD Details</button><div id="saveStatus" class="status" hidden></div></div></div></section><section id="confirmation" hidden></section></section></div></main><div id="footer"></div><div id="chargeLockModal" class="charge-lock-modal" hidden role="presentation"><div id="chargeLockDialog" class="charge-lock-dialog" role="dialog" aria-modal="true" aria-labelledby="chargeLockTitle" tabindex="-1"><h3 id="chargeLockTitle">Charge Locked</h3><p>This charge cannot be edited because a refund has already been issued.</p><div class="charge-lock-actions"><button id="chargeLockOk" type="button" class="charge-lock-ok">OK</button></div></div></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/common.js"></script><script src="js/secure.js"></script><script src="js/schedule.js"></script><script src="js/opd_update.js"></script></body></html>
