<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><link rel="stylesheet" href="css/base.css"><title>Update OPD Details | NEURON Hospital</title><style>
.opd-loading{color:#7b1fa2;font-weight:800;margin-top:8px}.opd-loading-btn{background:#7b1fa2!important;color:#fff!important}.opd-updating-btn{background:#7b1fa2!important;color:#fff!important}.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.payment-total{margin-top:9px;background:#f7f7fb;border-radius:10px;padding:10px;font-weight:900}.changed-list{margin:10px 0 0;padding-left:20px}.changed-list li{margin:5px 0}
</style></head><body data-title="Update OPD Details"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>Update OPD Details</h1><p>Secure same-day update</p></section>
<section id="gate" class="card secure-wrap"><h2>🔐 Secure Access</h2><input id="password" type="password" inputmode="numeric" maxlength="6" placeholder="Password"><button id="enter" class="cta" style="width:100%;margin-top:10px">Access Portal</button></section>
<section id="portal" hidden><section class="card"><div class="grid"><div><label>City</label><select id="city"></select></div><div><label>WhatsApp Number</label><div class="input-row"><div class="prefix-wrap"><span class="prefix">+91</span><input id="wa" maxlength="10"></div><button id="load" class="btn btn-secondary">Load</button></div><div id="loadStatus" class="status" hidden></div></div></div><div id="status" class="status"></div><div id="patients" class="patient-list"></div></section>
<section id="edit" class="card" hidden><div class="grid"><div><label>Patient Name</label><input id="name"></div><div><label>Age</label><div class="input-row"><input id="age" type="number" step=".1"><select id="unit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div><div class="field full"><label>Address</label><textarea id="address"></textarea></div><div><label>Referred By Dr./Hospital</label><input id="ref"></div><div><label>Correct WhatsApp Number</label><input id="editWa" maxlength="10"></div><div><label>Next Follow-up City</label><select id="nextFollowupCity"></select></div><div id="chargeField"><label id="chargeLabel">OPD Charges Paid</label><input id="charge" type="number" min="0" max="2000"></div><div id="splitCashField" hidden><label>Paid in Cash</label><input id="cash" type="number" min="0" max="2000"></div><div id="splitOnlineField" hidden><label>Paid Online</label><input id="online" type="number" min="0" max="2000"></div><div id="splitTotalField" class="field full" hidden><div class="payment-total">Total Amount Paid: ₹<span id="totalPaid">0</span></div></div><div class="field full"><button id="save" class="cta" style="width:100%">Update OPD Details</button><div id="saveStatus" class="status" hidden></div></div></div></section><section id="confirmation" hidden></section></section></div></main><div id="footer"></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/idb.js"></script><script src="js/common.js"></script><script src="js/secure.js"></script><script>document.body.dataset.mode="opd";</script><script>
document.addEventListener("DOMContentLoaded",()=>{
 const isOPD=true;let selected=null;
 const clearLoadedState=()=>{selected=null;$('patients').innerHTML="";$('edit').hidden=true;$('confirmation').hidden=true;$('confirmation').innerHTML="";$('status').textContent="";$('loadStatus').hidden=true;$('saveStatus').hidden=true;$('saveStatus').textContent="";};
 const setLoadBusy=(busy)=>{$('load').disabled=busy;$('load').textContent=busy?"Loading...":"Load";$('load').classList.toggle("opd-loading-btn",busy);};
 const setSaveBusy=(busy)=>{$('save').disabled=busy;$('save').textContent=busy?"Updating...":"Update OPD Details";$('save').classList.toggle("opd-updating-btn",busy);};
 const paymentMode=()=>{const c=Number($('cash').dataset.actual||0),o=Number($('online').dataset.actual||0);if(c>0&&o>0)return "Split";if(o>0)return "Online";return "Cash";};
 const refreshPaymentUI=()=>{const mode=paymentMode();const c=Number($('cash').value)||0,o=Number($('online').value)||0;$('chargeField').hidden=mode==="Split";$('splitCashField').hidden=mode!=="Split";$('splitOnlineField').hidden=mode!=="Split";$('splitTotalField').hidden=mode!=="Split";$('chargeLabel').textContent=mode==="Cash"?"OPD Charges Paid in Cash":mode==="Online"?"OPD Charges Paid Online":"OPD Charges Paid in Split";if(mode==="Split")$('totalPaid').textContent=(c+o).toFixed(2).replace(/\.00$/,'');};
 const renderPatient=(x,b)=>{selected=x;document.querySelectorAll('.patient-option').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');$('edit').hidden=false;$('confirmation').hidden=true;$('confirmation').innerHTML="";$('name').value=x.name||"";$('age').value=x.age??"";$('unit').value=x.ageUnit||"years";$('address').value=x.address||"";$('ref').value=x.referredBy||"";$('editWa').value=x.whatsapp||"";$('nextFollowupCity').innerHTML=NEURON_CONFIG.cities.map(c=>`<option value="${U.esc(c)}">${U.esc(c)}</option>`).join("");$('nextFollowupCity').value=x.nextFollowupCity||"";$('charge').value=x.opdCharges??0;$('cash').value=x.opdCashPaid??0;$('online').value=x.opdOnlinePaid??0;$('cash').dataset.actual=String(x.opdCashPaid??0);$('online').dataset.actual=String(x.opdOnlinePaid??0);refreshPaymentUI();};
 $('city').innerHTML=NEURON_CONFIG.cities.map(x=>`<option>${U.esc(x)}</option>`).join("");
 $('city').addEventListener("change",()=>{clearLoadedState();});
 $('load').onclick=async()=>{clearLoadedState();setLoadBusy(true);$('loadStatus').hidden=false;$('loadStatus').className="status opd-loading";$('loadStatus').textContent="Wait we are Loading Today's OPD details from system...";try{const r=await NeuronAPI.call("getEEGPatientsByWhatsApp",{whatsapp:U.phone($('wa').value),city:$('city').value});r.patients.forEach((x)=>{const b=document.createElement('button');b.className='patient-option';b.innerHTML=`<b>${U.esc(x.name)}</b><small>${x.age} ${U.esc(x.ageUnit)} • ${U.date(x.date)}</small>`;b.onclick=()=>renderPatient(x,b);$('patients').appendChild(b);});if(r.patients.length===1)renderPatient(r.patients[0],$('patients').firstElementChild);else if(!r.patients.length)$('status').textContent="No today's OPD patient found.";}catch(e){$('status').textContent=e.message||"Unable to load OPD details."}finally{setLoadBusy(false);$('loadStatus').hidden=true;}};
 $('save').onclick=async()=>{if(!selected)return;setSaveBusy(true);$('saveStatus').hidden=false;$('saveStatus').className="status opd-loading";$('saveStatus').textContent="Wait we are updating OPD details to system...";const mode=paymentMode(),charge=mode==="Cash"?Number($('charge').value)||0:mode==="Online"?Number($('charge').value)||0:(Number($('cash').value)||0)+(Number($('online').value)||0);const id=U.uuid("upd"),p={updateRequestId:id,appointmentId:selected.appointmentId,city:selected.city,whatsapp:selected.whatsapp,whatsappNew:U.phone($('editWa').value),name:U.title($('name').value),age:Number($('age').value),ageUnit:$('unit').value,address:U.title($('address').value),referredBy:U.title($('ref').value),nextFollowupCity:$('nextFollowupCity').value,opdCharges:charge,opdPaymentMode:mode,opdCashPaid:mode==="Online"?0:mode==="Cash"?charge:Number($('cash').value)||0,opdOnlinePaid:mode==="Cash"?0:mode==="Online"?charge:Number($('online').value)||0};try{await IDB.put("tx",{id,type:"OPD_UPDATE",status:"pending",payload:p});const r=await NeuronAPI.call("updateOPDDetails",p,25000);await IDB.put("tx",{id,type:"OPD_UPDATE",status:"complete",payload:p,result:r});const before=r.before||{},after=r.after||{};const fields=[['Patient Name',before.name,after.name],['Age',`${before.age} ${before.ageUnit}`,`${after.age} ${after.ageUnit}`],['Address',before.address,after.address],['Referred By Dr./Hospital',before.referredBy,after.referredBy],['WhatsApp Number',before.whatsapp,after.whatsapp],['Next Follow-up City',before.nextFollowupCity,after.nextFollowupCity],['OPD Charges Paid',before.opdTotalPaid,after.opdTotalPaid],['Paid in Cash',before.opdCashPaid,after.opdCashPaid],['Paid Online',before.opdOnlinePaid,after.opdOnlinePaid]];const changed=fields.filter(f=>String(f[1]??"")!==String(f[2]??""));$('confirmation').hidden=false;$('confirmation').innerHTML=`<div class="success"><div class="success-icon">✓</div><h2>OPD Details Updated</h2><p>Appointment ID: <b>${U.esc(r.appointmentId)}</b></p>${changed.length?`<p><b>Changed and updated:</b></p><ul class="changed-list">${changed.map(f=>`<li><b>${U.esc(f[0])}</b>: ${U.esc(String(f[1]??""))} → <b>${U.esc(String(f[2]??""))}</b></li>`).join('')}</ul>`:`<p>No values were changed.</p>`}</div>`;}catch(e){await IDB.put("tx",{id,type:"OPD_UPDATE",status:"uncertain",payload:p}).catch(()=>{});alert(e.message||"Update status is uncertain. Do not repeat it until the original request is checked.");}finally{setSaveBusy(false);$('saveStatus').hidden=true;}};
});
</script><script src="js/recovery.js"></script></body></html>
