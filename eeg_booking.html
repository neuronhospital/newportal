<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1fa2"><link rel="stylesheet" href="css/base.css"><title>EEG Booking | NEURON Hospital</title></head><body data-title="EEG Booking"><div id="header"></div><main><div class="container">
<section class="page-title"><h1>EEG Booking Portal</h1><p>Today's OPD patients only</p></section><section class="card"><div class="grid"><div><label>City</label><select id="city"></select></div><div><label>WhatsApp Number</label><div class="input-row"><div class="prefix-wrap"><span class="prefix">+91</span><input id="wa" maxlength="10"></div><button id="load" class="btn btn-secondary">Load</button></div><div id="loadMessage" class="status" hidden>Retrieving Patient information from the system...</div></div></div><div id="status" class="status"></div><div id="patients" class="patient-list"></div><div id="payment" hidden><div class="grid"><div><label>Payment Mode</label><select id="mode"><option>Cash</option><option>Online</option><option>Split</option></select></div></div><div id="singlePayment"><div><label id="singlePaymentLabel">Cash</label><input id="amount" type="number" min="0" max="3000"></div></div><div id="split" hidden><div class="payment-grid"><div><label>Cash</label><input id="cash" type="number" min="0" max="3000"></div><div><label>Online</label><input id="online" type="number" min="0" max="3000"></div></div><div class="payment-total"><span>Total Sum of charges: </span><span id="total">₹0</span></div></div><button id="book" class="cta" style="width:100%;margin-top:14px">Book EEG Appointment</button><div id="bookMessage" class="status" hidden>Wait we are Confirming your EEG Booking...</div></div></section><section id="confirmation" hidden></section>
</div></main><div id="footer"></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/idb.js"></script><script src="js/common.js"></script><script src="js/eeg.js"></script><script src="js/recovery.js"></script></body></html>
